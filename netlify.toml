[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
from = "/articles/*"
to = "https://howswork.ghost.io/blog/:splat"
status = 200
force = true
headers = {X-Forwarded-Host = "howswork.app"}

[[redirects]]
from = "/articles"
to = "https://howswork.ghost.io/blog/"
status = 200
force = true
headers = {X-Forwarded-Host = "howswork.app"}